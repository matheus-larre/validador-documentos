spring.application.name=validador-documentos

# Tamanho máximo do upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
# Evita que o Tomcat derrube a conexão quando o arquivo passa do limite
server.tomcat.max-swallow-size=-1
# Pasta onde os documentos ficam salvos
app.upload.dir=uploads

# OCR (Tesseract)
# Usa a variável de ambiente TESSDATA_PATH se existir; senão, a pasta padrão do Windows
ocr.tessdata-path=${TESSDATA_PATH:C:/Program Files/Tesseract-OCR/tessdata}
ocr.idioma=por
