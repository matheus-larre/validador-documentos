spring.application.name=validador-documentos

# Tamanho máximo do upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
# Evita que o Tomcat derrube a conexão quando o arquivo passa do limite
server.tomcat.max-swallow-size=-1
# Sessão só por cookie: impede o Tomcat de colocar ";jsessionid=..." na URL do redirect (dava 404)
server.servlet.session.tracking-modes=cookie
# Pasta onde os documentos ficam salvos
app.upload.dir=uploads

# OCR (Tesseract)
# Usa a variável de ambiente TESSDATA_PATH se existir; senão, a pasta padrão do Windows
ocr.tessdata-path=${TESSDATA_PATH:C:/Program Files/Tesseract-OCR/tessdata}
ocr.idioma=por

# Banco de dados (PostgreSQL): variáveis de ambiente com valores padrão para desenvolvimento local
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/validador}
spring.datasource.username=${DB_USER:validador}
spring.datasource.password=${DB_PASSWORD:validador}
# MVP: o Hibernate cria/atualiza as tabelas a partir das entidades (em produção: migrações com Flyway)
spring.jpa.hibernate.ddl-auto=update
# Conexão com o banco só dentro dos services, não durante a renderização da tela
spring.jpa.open-in-view=false

# Lê o arquivo .env da raiz do projeto (se existir) como propriedades
spring.config.import=optional:file:.env[.properties]

# IA (Google Gemini)
gemini.api-key=${GEMINI_API_KEY:}
# Versão fixa (e não o apelido "latest"): comportamento previsível e menos sobrecarga em picos de uso
gemini.modelo=${GEMINI_MODEL:gemini-2.5-flash}
