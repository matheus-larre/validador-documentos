# Perfil "test": ativado com @ActiveProfiles("test") nos testes que sobem o Spring.
# Troca o PostgreSQL por um H2 em memória, então os testes não precisam de Docker.
# (Não usar application.properties aqui: ele esconderia o arquivo principal.)
spring.datasource.url=jdbc:h2:mem:validador;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop

# Os testes nunca devem usar a chave real do Gemini
gemini.api-key=
